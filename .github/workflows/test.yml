name: tests
on: [push, pull_request]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run host tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Icore/include \
              test/test_apogee.c core/src/apogee.c core/src/vapogee.c core/src/boost.c \
              core/src/burnout.c core/src/landing.c core/src/state.c \
              -lm -o test_apogee
          ./test_apogee